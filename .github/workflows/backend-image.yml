# Builds backend/Dockerfile and pushes it to GitHub Container Registry:
#   ghcr.io/<owner>/kannada-ocr-backend:latest  (and :<commit sha>)
# Azure Container Apps runs this image (see README, "Deploy").
name: Backend image
on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image name (registry paths must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kannada-ocr-backend" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
