<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Karnataka flag badge (yellow over red). The header logo says ಕನ್ನಡ; at tab-icon size only ಕ is legible. -->
  <clipPath id="c"><circle cx="32" cy="32" r="31"/></clipPath>
  <g clip-path="url(#c)">
    <rect width="64" height="32" fill="#F5E22A"/>
    <rect y="32" width="64" height="32" fill="#E3202A"/>
  </g>
  <text x="32" y="45" text-anchor="middle" font-size="36" font-weight="800" fill="#111111" stroke="#FFFFFF" stroke-width="2.5" paint-order="stroke" font-family="'Noto Sans Kannada', 'Nirmala UI', sans-serif">ಕ</text>
</svg>
